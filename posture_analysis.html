<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>RE:WALK 자세 분석 시스템 (모듈화 버전)</title>
<link rel="stylesheet" href="./css/local_font.css">
<link rel="stylesheet" href="css/analysis_tool.css">

</head>
<body>
<div id="print-area"></div>

<div id="pa-root">
  <div class="pa-nav">
    <button class="pa-nav-btn on" data-tab="analyze"><span class="material-icons" style="font-size:16px;vertical-align:middle;">camera_alt</span> 분석</button>
    <button class="pa-nav-btn" data-tab="compare"><span class="material-icons" style="font-size:16px;vertical-align:middle;">compare</span> 회차비교</button>
    <button class="pa-nav-btn" data-tab="history"><span class="material-icons" style="font-size:16px;vertical-align:middle;">folder</span> 기록관리</button>
  </div>

<div class="pa-panel on" id="pa-analyze" style="background: #000; min-height: 100vh; display: flex; flex-direction: column;">
    
    <!-- 📌 상단 헤더 (뒤로 가기 버튼 추가 및 이름 배치) -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-bottom: 1px solid #333;">
        
        <!-- 🚨 뒤로 가기 버튼 & 대상자 이름 묶음 -->
        <div style="display: flex; align-items: center; gap: 12px; z-index: 100;">
            <button onclick="window.history.back();" style="background: transparent; border: none; color: #fff; cursor: pointer; padding: 0; display: flex; align-items: center;" title="이전 화면으로">
                <span class="material-icons" style="font-size: 22px;">arrow_back_ios_new</span>
            </button>
            <div id="display-name" style="color: #4A90E2; font-size: 15px; font-weight: bold;">
                👤 대상자 로딩중
            </div>
        </div>

        <!-- 뷰 선택 탭(정면/측면/후면) -->
        <div class="pa-vtabs" style="display: flex; gap: 5px; margin: 0; z-index: 100;">
            <button class="pa-vtab on" data-v="front" style="padding: 6px 12px; font-size: 13px; border-radius: 8px;">정면</button>
            <button class="pa-vtab" data-v="side" style="padding: 6px 12px; font-size: 13px; border-radius: 8px;">측면</button>
            <button class="pa-vtab" data-v="back" style="padding: 6px 12px; font-size: 13px; border-radius: 8px;">후면</button>
        </div>
        
        <!-- JS 에러 방지용 숨김 데이터 -->
        <div style="display: none;">
            <span id="pa-vname">정면</span>
            <span id="pa-veng">Anterior View</span>
            <span id="pa-upbtn-txt">사진 선택</span>
        </div>
    </div>

    <!-- 📌 메인 캔버스 및 라이브 카메라 영역 -->
        <div class="pa-cvi" id="pa-cvi" style="position: relative; flex: 1; min-height: 55vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000;">
            <div class="pa-ph" id="pa-ph" style="color: rgba(255,255,255,0.5); text-align: center; z-index: 1;">
                <span class="material-icons" style="font-size:48px;">add_photo_alternate</span>
                <div class="pa-ph-txt">사진을 불러오거나 라이브 촬영을 시작하세요</div>
            </div>
            
            <!-- 🚨 신규 추가: 실시간 카메라 스트리밍 화면 -->
            <video id="pa-live-video" autoplay playsinline style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; z-index:5;"></video>
            
            <!-- 캡처 및 갤러리 이미지 표시용 -->
            <img id="pa-img" style="display:none; max-width: 100%; max-height: 100%; object-fit: contain; z-index:6;" alt="자세 사진"/>
            
            <!-- 그리기 및 격자 오버레이용 캔버스 (카메라 위로 겹쳐짐) -->
            <canvas id="pa-cv" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;"></canvas>
            <div class="pa-cvhint" id="pa-cvhint" style="display:none;"></div>

            <!-- 🚨 신규 추가: 라이브 카메라 작동 시 나타나는 촬영 컨트롤러 -->
            <div id="pa-live-controls" style="display:none; position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:20; flex-direction:row; gap:20px; align-items:center;">
                <button type="button" id="pa-btn-cam-switch" style="width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; border:1px solid #555; display:flex; justify-content:center; align-items:center;"><span class="material-icons">flip_camera_ios</span></button>
                <button type="button" id="pa-btn-capture" style="width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid #4A90E2; box-shadow:0 0 15px rgba(0,0,0,0.5);"></button>
                <button type="button" id="pa-btn-cam-cancel" style="width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,0.6); color:#fff; border:1px solid #555; display:flex; justify-content:center; align-items:center;"><span class="material-icons">close</span></button>
            </div>

        <!-- 그리기 도구 서랍 -->
        <div class="pa-overlay-drawer" id="pa-overlay-drawer" style="position: absolute; right: 0; top: 20px; z-index: 20;">
            <button type="button" class="pa-drawer-handle" id="pa-drawer-handle">
                <span class="material-icons" id="pa-drawer-icon">chevron_left</span>
            </button>
            <div class="pa-drawer-content" style="background: rgba(0,0,0,0.8); border-radius: 8px;">
              <div class="pa-ot-group">
                <button type="button" id="pa-grid-density-btn" class="pa-ot-btn" title="격자 순환"><span class="material-icons">grid_off</span><span class="ot-txt">격자 OFF</span></button>
                <button type="button" id="pa-lbl-btn" class="pa-ot-btn on" title="측정값"><span class="material-icons">straighten</span><span class="ot-txt">측정값</span></button>
                <button type="button" id="pa-moire-btn" class="pa-ot-btn" title="등고선"><span class="material-icons">3d_rotation</span><span class="ot-txt">등고선</span></button>
              </div>
              <div class="pa-ot-divider"></div>
              <div class="pa-ot-group">
                <button type="button" class="pa-ot-btn pa-sh-btn on" data-tool="edit" title="선택/이동"><span class="material-icons">open_with</span></button>
                <button type="button" class="pa-ot-btn pa-sh-btn" data-tool="rect" title="사각형"><span class="material-icons">crop_square</span></button>
                <button type="button" class="pa-ot-btn pa-sh-btn" data-tool="circle" title="원"><span class="material-icons">panorama_fish_eye</span></button>
                <button type="button" class="pa-ot-btn pa-sh-btn" data-tool="arrow" title="화살표"><span class="material-icons">north_east</span></button>
                <button type="button" id="pa-undo" class="pa-ot-btn" title="되돌리기"><span class="material-icons">undo</span></button>
                <button type="button" id="pa-clear" class="pa-ot-btn danger" title="삭제"><span class="material-icons">delete_outline</span></button>
              </div>
              <div class="pa-ot-divider"></div>
              <div class="pa-ot-colors">
                <button type="button" class="pa-dot on" data-c="#D9842A" style="background:#D9842A"></button>
                <button type="button" class="pa-dot" data-c="#C0392B" style="background:#C0392B"></button>
                <button type="button" class="pa-dot" data-c="#2E5C9E" style="background:#2E5C9E"></button>
                <button type="button" class="pa-dot" data-c="#2E8B57" style="background:#2E8B57"></button>
              </div>
            </div>
        </div>
    </div>

    <!-- 📌 AI 상태 안내 및 하단 플로팅 컨트롤 (다크 모드 조화) -->
    <div style="background: #111; padding: 10px 0;">
        <div class="pa-auto-st" id="pa-auto-st" style="color: #4A90E2; font-size: 13px; text-align: center; margin-bottom: 5px;">
            안내: 하단의 버튼을 눌러 이미지를 불러오세요.
        </div>
        <div class="pa-rotbar" id="pa-rotbar" style="display:none; justify-content: center; align-items: center; gap: 10px; color: #fff;">
            <button class="pa-rotbtn" id="pa-rot-l" type="button">↺</button>
            <input type="range" id="pa-rot" min="-15" max="15" step="0.5" value="0" class="pa-rotrange">
            <button class="pa-rotbtn" id="pa-rot-r" type="button">↻</button>
        </div>
    </div>

    <!-- 📌 하단 컨트롤 패널 -->
    <div class="control-panel" style="background: #1e293b; padding: 15px; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; justify-content: space-around; align-items: center;">
        <label class="btn" style="text-align: center; display: flex; flex-direction: column; align-items: center; cursor: pointer;">
            <div class="btn-icon" style="background: rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;"><span class="material-icons">photo_library</span></div>
            <span style="font-size: 11px; margin-top: 4px; color: #cbd5e1; font-weight:bold;">갤러리</span>
            <input type="file" id="pa-file" accept="image/*" style="display:none;">
        </label>

        <label class="btn" style="text-align: center; display: flex; flex-direction: column; align-items: center; cursor: pointer;">
            <div class="btn-icon" style="background: rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;"><span class="material-icons">photo_camera</span></div>
            <span style="font-size: 11px; margin-top: 4px; color: #cbd5e1; font-weight:bold;">카메라</span>
    <!-- 🚨 수정됨: 네이티브 카메라 대신 인앱 라이브 카메라를 호출하는 버튼 -->
            <button type="button" class="btn" id="pa-btn-live-cam" style="border: none; background: transparent; cursor: pointer; padding: 0;">
                <div class="btn-icon"><span class="material-icons">photo_camera</span></div>
                <span>라이브 촬영</span>
            </button>
        </label>

        <button class="btn pa-auto-btn" id="pa-auto-btn" style="border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center;" disabled>
            <div class="btn-icon" style="background: #4A90E2; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.4);"><span class="material-icons" style="font-size: 28px;">auto_awesome</span></div>
            <span style="font-size: 12px; font-weight: bold; margin-top: 6px; color: #4A90E2;">AI 자동 분석</span>
        </button>

        <button class="btn" id="pa-save" style="border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center;">
            <div class="btn-icon" style="background: rgba(255,255,255,0.1); color: #2E8B57; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;"><span class="material-icons">save</span></div>
            <span style="font-size: 11px; margin-top: 4px; color: #cbd5e1; font-weight:bold;">화면 저장</span>
        </button>
    </div>

    <!-- 📌 부가 기능 영역 (체크리스트를 위로, 메모를 아래로 배치) -->
    <div style="padding: 20px; background: #0f172a; flex: 1;">
        
        <!-- 1. 지도자 관찰 체크 (이름 변경 및 위로 배치) -->
        <div class="pa-card" id="pa-checklist-card" style="background:rgba(255,255,255,0.05); border-radius:12px; padding:15px; border: 1px solid #334155; margin-bottom: 20px;">
          <button class="pa-chk-toggle" id="pa-chk-toggle" type="button" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: transparent; border: none; color: #e2e8f0; font-size: 14px; font-weight: bold; cursor: pointer; padding: 0;">
            <span class="pa-chk-toggle-lbl">🔍 지도자 관찰 체크 <span class="pa-chk-count" id="pa-chk-count" style="display:none; margin-left:6px; background:#D9842A; color:#fff; padding:2px 6px; border-radius:10px; font-size:11px;"></span></span>
            <span class="pa-chk-arrow" id="pa-chk-arrow" style="transition: transform 0.3s ease; font-size: 20px;">▾</span>
          </button>
          <div class="pa-chk-body pa-chk-collapsed" id="pa-chk-body">
            <div style="font-size:11.5px; color:#8595AD; margin:12px 0 14px;">2D 측정으로 정량화 어려운 항목 · 육안 관찰 체크</div>
            <div class="pa-chk-grid">
              <div class="pa-chk-item"><label style="color:#e2e8f0;">라운드 숄더</label><select class="pa-chk-sel" data-chk="roundedShoulder"><option value="none">해당 없음</option><option value="mild">경도</option><option value="moderate">중등도</option><option value="severe">심함</option></select></div>
              <div class="pa-chk-item"><label style="color:#e2e8f0;">흉추후만</label><select class="pa-chk-sel" data-chk="thoracicKyphosis"><option value="none">해당 없음</option><option value="mild">경도</option><option value="moderate">중등도</option><option value="severe">심함</option></select></div>
              <div class="pa-chk-item"><label style="color:#e2e8f0;">요추전만</label><select class="pa-chk-sel" data-chk="lumbarLordosis"><option value="none">해당 없음</option><option value="mild">경도</option><option value="moderate">중등도</option><option value="severe">심함</option></select></div>
              <div class="pa-chk-item"><label style="color:#e2e8f0;">골반 전방경사</label><select class="pa-chk-sel" data-chk="anteriorPelvicTilt"><option value="none">해당 없음</option><option value="mild">경도</option><option value="moderate">중등도</option><option value="severe">심함</option></select></div>
              <div class="pa-chk-item"><label style="color:#e2e8f0;">골반 후방경사</label><select class="pa-chk-sel" data-chk="posteriorPelvicTilt"><option value="none">해당 없음</option><option value="mild">경도</option><option value="moderate">중등도</option><option value="severe">심함</option></select></div>
              <div class="pa-chk-item"><label style="color:#e2e8f0;">스웨이백</label><select class="pa-chk-sel" data-chk="swayBack"><option value="none">해당 없음</option><option value="present">관찰됨</option></select></div>
            </div>
          </div>
        </div>

        <!-- 2. 소견 메모 (체크리스트 아래로 이동 및 바탕색 흰색 유지) -->
        <label style="font-size: 13px; font-weight: bold; color: #e2e8f0; display: block;">📝 소견 메모</label>
        <textarea class="pa-ntxt" id="pa-notes" placeholder="예) 우측 어깨 하강, 거북목 심화 등" style="width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-top: 5px; height: 80px; font-family:inherit; background: #ffffff; color: #000000;"></textarea>
    </div>

    <div class="pa-panel" id="pa-compare">
      <div class="pa-wrap">
        <div class="pa-card">
          <div class="pa-sellbl">🔵 이전 회차 (Before)</div>
          <select class="pa-csel" id="pa-ca"></select>
          <div class="pa-sellbl">🔴 최근 회차 (After)</div>
          <select class="pa-csel" id="pa-cb"></select>

          <div class="pa-vtabs" style="margin-top:10px;">
            <button class="pa-cvt on" data-cv="front">정면</button>
            <button class="pa-cvt" data-cv="side">측면</button>
            <button class="pa-cvt" data-cv="back">후면</button>
          </div>

          <div class="pa-cgrid">
            <div>
              <div class="pa-chdr" style="background:#1F3864">이전</div>
              <div class="pa-cwrap-comp" id="pa-cia"><div class="pa-cinner-comp" style="color:#888; font-size:12px;">선택 대기중</div></div>
            </div>
            <div>
              <div class="pa-chdr" style="background:#D9842A">최근</div>
              <div class="pa-cwrap-comp" id="pa-cib"><div class="pa-cinner-comp" style="color:#888; font-size:12px;">선택 대기중</div></div>
            </div>
          </div>
          
          <button class="pa-btn pa-green" id="pa-cpdf">
              <span class="material-icons" style="vertical-align:middle; font-size:18px;">print</span> Before/After 맞춤 리포트 출력
          </button>
        </div>
      </div>
    </div>

    <div class="pa-panel" id="pa-history">
      <div class="pa-wrap">
        <button class="pa-btn pa-teal" id="pa-new-session-btn" style="margin-bottom: 8px; box-shadow: 0 4px 12px rgba(46,92,158,0.2);">
            <span class="material-icons" style="vertical-align:middle; font-size:18px;">add_circle_outline</span> 새로운 측정(회차) 시작하기
        </button>
        <div style="font-size:12px; color:#8595AD; text-align:center; margin-bottom:15px; word-break:keep-all;">같은 날 연속 측정 시, 위 버튼을 눌러 이전 기록을 보존하고 새 회차를 만드세요.</div>
        
        <div class="pa-card" id="pa-slist" style="background:transparent; box-shadow:none; padding:0;"></div>
      </div>
      </div>
    </div>

<button class="btn-save-dash" id="pa-btn-dash">
    <span class="material-icons" style="vertical-align:middle;">check_circle</span> 모든 측정 완료 및 대시보드 복귀
</button>

<script src="mediapipe/pose.js"></script>
<script src="js/data.js"></script>
<script src="js/posture_app.js"></script>

<!-- 🚀 탭 메뉴 전환 강제 보증 스크립트 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const navBtns = document.querySelectorAll('.pa-nav-btn');
    const panels = document.querySelectorAll('.pa-panel');

    if(navBtns.length > 0) {
        navBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // 1. 모든 탭 버튼과 화면 끄기
                navBtns.forEach(b => b.classList.remove('on'));
                panels.forEach(p => p.classList.remove('on'));

                // 2. 클릭한 탭 켜기 및 연결된 화면 보여주기
                this.classList.add('on');
                const targetId = 'pa-' + this.getAttribute('data-tab');
                const targetPanel = document.getElementById(targetId);
                if(targetPanel) targetPanel.classList.add('on');
                
                // 3. 화면 최상단으로 부드럽게 스크롤
                window.scrollTo({top: 0, behavior: 'smooth'});
            });
        });
    }
});
</script>
<script>
// 🚀 지도자 관찰 체크 펼치기/접기 및 화살표 애니메이션 스크립트
ddocument.addEventListener('DOMContentLoaded', function() {
    // 버튼, 열릴 본문, 화살표 아이콘을 정확히 찾습니다.
    var toggleBtn = document.getElementById('pa-chk-toggle');
    var chkBody = document.getElementById('pa-chk-body');
    var chkArrow = document.getElementById('pa-chk-arrow');

    if(toggleBtn && chkBody) {
        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault(); // 기본 클릭 시 화면 튕김 방지
            
            // pa-chk-collapsed 클래스를 뗐다 붙였다 하면서 접기/펼치기 수행
            var isCollapsed = chkBody.classList.toggle('pa-chk-collapsed');
            
            // 화살표 빙글 도는 애니메이션
            if(chkArrow) {
                chkArrow.style.transform = isCollapsed ? 'rotate(0deg)' : 'rotate(180deg)';
                chkArrow.style.display = 'inline-block';
                chkArrow.style.transition = 'transform 0.3s';
            }
        });
    }
});
</script>
</body>
</html>
